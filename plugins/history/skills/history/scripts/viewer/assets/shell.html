<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 제목과 아이콘은 `00-app.js`가 프로젝트 이름으로 채운다. 여기 값은 그때까지의 것이고,
     아이콘의 빈 `href`는 브라우저가 `/favicon.ico`를 찾아가지 않게 자리를 미리 잡는다 -->
<title>history</title>
<link id="favicon" rel="icon" href="data:,">
<style>{{STYLE}}</style>
<!-- 사용자 설정. 서버가 `~/.claude/history/config.json`을 읽어 심는다.
     대화 데이터 구획이 아니라 여기 있는 이유는 아래 부트가 head에서 이 값을 읽어야 하기
     때문이다 — 자산 JS와 데이터는 body 끝이라 부트보다 뒤에 온다.

     **주석에 자리표시자 문자열을 쓰지 않는다.** 치환은 주석을 가리지 않으므로 그 자리에도
     데이터가 들어가고, 데이터에 주석 종료 기호가 있으면 거기서 주석이 닫혀 나머지 JSON이
     본문으로 노출된다 -->
<script type="application/json" id="config">{{CONFIG}}</script>

<!-- 저장된 테마를 화면이 그려지기 전에 적용한다. 여기서 하지 않으면 이미 그려진 화면이
     뒤집혀 흰 화면이 스친다. 순환·저장·라벨은 50-theme.js가 갖고 여기는 첫 적용만 한다 -->
<script>
(function () {
  let choice = 'system';
  try {
    choice = JSON.parse(document.getElementById('config').textContent).theme || 'system';
  } catch (e) {
    // 심긴 값이 없거나 깨졌다. 시스템 판정으로 간다
  }
  /* 파일로 연 화면에는 저장을 보낼 서버가 없어 브라우저에만 남는다. 그쪽에서 바꾼 값은
     심긴 값보다 새로우므로 덮어 읽는다. 서버로 열었을 때는 보지 않는다 — 포트가 실행마다
     달라 오리진이 바뀌고, 그러면 이 저장소는 매번 비어 있다 */
  if (location.protocol === 'file:') {
    try {
      choice = localStorage.getItem('history.viewer.theme') || choice;
    } catch (e) {
      // localStorage 접근이 막힌 환경
    }
  }
  // 알 수 없는 값도 시스템으로 본다. 50-theme.js의 read()와 같은 폴백이다
  const dark = choice === 'dark'
    || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
</head>
<body>

<div id="notice" hidden></div>

<!-- 왼쪽은 무엇을 보고 있는지, 오른쪽은 축과 무관한 전역 설정이다.
     테마 버튼의 라벨은 50-theme.js가, 이름과 경로는 00-app.js가 채운다.
     구분선은 장식이므로 읽어 줄 것이 없다 -->
<header id="top">
  <div id="brand">
    <span id="brandMark">history</span>
    <span id="brandSep" aria-hidden="true"></span>
    <span id="project"></span>
    <span id="projectPath"></span>
    <button id="revealProject" type="button" hidden></button>
  </div>
  <button id="theme" type="button"></button>
</header>

<!-- 도구 모음. 검색창이 화면 가운데에 서고 왼쪽은 파괴적 연산 UI가, 오른쪽은 축과
     무관한 전역 동작이 채운다. 세 자리를 그리드 칼럼으로 못 박으므로 왼쪽이 나타나고
     사라져도 검색창이 움직이지 않는다. 오른쪽 버튼은 60-toolbar.js가 채운다 -->
<div id="toolbar">
  <input id="search" type="search" placeholder="검색…" autocomplete="off" spellcheck="false">
  <div id="tb-actions"></div>
</div>

<nav id="tabs"></nav>

<main id="split">
  <section id="list" class="pane"></section>
  <div id="handle" role="separator" aria-orientation="vertical"></div>
  <section id="body" class="pane">
    <button id="back" type="button">← 목록</button>
    <div id="bodyInner"></div>
  </section>
</main>

<script type="application/json" id="data">{{DATA}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
